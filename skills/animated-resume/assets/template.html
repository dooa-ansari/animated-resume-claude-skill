<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#07121B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  /* Theme tokens. The page script overwrites these from profile.theme (preset or custom values). */
  --bg:#07121B; --surface:#0E1D29; --ink:#E2EFF4; --muted:#8AA3B2; --line:#1B3141;
  --a1:#2DD4E6; --a2:#5B8CFF; --a3:#34D399; --a4:#9AE66E;
  --skin:#E3AD8A; --skin-d:#C78A68; --hair:#16100E; --hair-hi:#3A2A24; --shirt:#8C1F2E; --shirt-d:#5E1220; --lips:#C24F62; --eyes:#5A321F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
body{background-image:radial-gradient(900px 500px at 85% -5%,color-mix(in srgb,var(--a1) 10%,transparent),transparent 60%),radial-gradient(800px 500px at -10% 30%,color-mix(in srgb,var(--a3) 7%,transparent),transparent 60%);background-attachment:fixed}
.scene.noscene{display:none}
.me.solo{grid-template-columns:1fr}.me.solo .perks{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.me.solo .perks{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Layout: a game-style "career quest" — avatar hero with XP bar, achievements, a level path rail, stack-era band, reasons grid. */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:0 20px;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800;letter-spacing:-.02em}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--a1);font-weight:600}
section{padding-block:72px 24px}
.sec-head{display:grid;gap:10px;margin-bottom:32px;max-width:640px}
.sec-head p{color:var(--muted);margin:0}
a{color:var(--a2)}
:focus-visible{outline:3px solid var(--a2);outline-offset:3px;border-radius:6px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px)}
.logo{font-family:var(--mono);font-weight:600;font-size:.85rem}
.logo b{color:var(--a1)}
.lang{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-family:var(--mono);font-size:.78rem;font-weight:600;padding:6px 12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:40px 24px}
.hero h1{font-size:clamp(3rem,9vw,6.4rem);font-weight:800;letter-spacing:-.04em}
.hero h1 span{display:inline-block;animation:rise .8s cubic-bezier(.2,.9,.3,1.3) both}
.hero h1 span:nth-child(2){animation-delay:.12s;color:var(--a1)}
.role{font-family:var(--display);font-size:clamp(1.1rem,2.2vw,1.45rem);font-weight:600;margin:18px 0 6px}
.role em{font-style:normal;color:var(--a2)}
.meta{display:grid;gap:6px}
.loc{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:8px}
.loc svg{flex:none;color:var(--a1)}
.lede{max-width:56ch;color:var(--muted);margin:18px 0 0}
@keyframes rise{from{transform:translateY(40%) rotate(-3deg);opacity:.2}to{transform:none;opacity:1}}

.xp{margin-top:26px;display:grid;gap:8px;max-width:440px}
.xp-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.78rem;font-weight:600}
.xp-track{height:16px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
.xp-fill{height:100%;width:88%;border-radius:999px;background:linear-gradient(90deg,var(--a3),var(--a2) 60%,var(--a1));transform-origin:left;animation:fill 1.8s .4s cubic-bezier(.2,.8,.2,1) both;position:relative}
.xp-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(255,255,255,.22) 8px 14px);animation:stripes 1s linear infinite}
@keyframes fill{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes stripes{to{background-position:28px 0}}

/* avatar */
.stage{position:relative;aspect-ratio:1;max-width:420px;width:100%;justify-self:center}
.stage svg{width:100%;height:100%;overflow:visible}
.ring{transform-origin:200px 210px;animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite;transform-origin:200px 300px}
@keyframes bob{50%{transform:translateY(-8px)}}
.lid{opacity:0;animation:blink 5s infinite}
@keyframes blink{0%,93%,98%,100%{opacity:0}95%{opacity:1}}
.arm{transform-box:fill-box;transform-origin:10% 90%}
.stage.wave .arm{animation:wave .9s ease-in-out 2}
@keyframes wave{25%{transform:rotate(-28deg)}75%{transform:rotate(14deg)}}
.keys rect{animation:tap 1.2s infinite}
.keys rect:nth-child(2){animation-delay:.3s}.keys rect:nth-child(3){animation-delay:.6s}.keys rect:nth-child(4){animation-delay:.9s}
@keyframes tap{50%{opacity:.25}}
.glyph{font-family:var(--mono);font-weight:600;font-size:22px;animation:float 6s ease-in-out infinite}
.glyph:nth-of-type(2){animation-delay:-2s}.glyph:nth-of-type(3){animation-delay:-4s}.glyph:nth-of-type(4){animation-delay:-1s}
@keyframes float{50%{transform:translateY(-14px)}}
.screen-line{animation:code 3s steps(6) infinite}
@keyframes code{0%{width:0}}
.avatar-btn{all:unset;cursor:pointer;display:block;width:100%;height:100%;border-radius:50%}
.bubble{position:absolute;top:2%;left:50%;transform:translateX(-10%);background:var(--ink);color:var(--bg);font-size:.88rem;font-weight:500;padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:opacity .3s,transform .3s}
.bubble.hide{opacity:0;transform:translateX(-10%) translateY(8px)}
.hint{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.72rem;color:var(--muted)}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.badge{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:4px;transition:transform .25s,border-color .25s}
.badge:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--a1)}
.badge .n{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
.badge:nth-child(1) .n{color:var(--a2)}.badge:nth-child(2) .n{color:var(--a1)}.badge:nth-child(3) .n{color:var(--a3)}.badge:nth-child(4) .n{color:var(--a4)}
.badge .l{font-size:.9rem;color:var(--muted)}
.badge .k{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* level path */
.path{position:relative;display:grid;gap:18px;padding-left:64px}
.rail{position:absolute;left:23px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--line)}
.rail i{position:absolute;inset:0 0 auto 0;height:var(--p,100%);border-radius:4px;background:linear-gradient(var(--a3),var(--a2),var(--a1))}
.lvl{position:relative}
.dot{position:absolute;left:-64px;top:14px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);font-family:var(--mono);font-weight:600;font-size:.8rem;transition:all .4s cubic-bezier(.2,.9,.3,1.4)}
.lvl.lit .dot{border-color:var(--c);background:var(--c);color:#13221F;transform:scale(1.08)}
.card{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px;transition:border-color .3s,transform .3s}
.card:hover{border-color:var(--c);transform:translateX(4px)}
.card-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.card h3{font-size:1.3rem;font-weight:700}
.when{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.co{font-weight:600;color:var(--c)}
.unlock{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.lvl.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden;min-width:0}
.more ul{margin:14px 0 0;padding-left:18px;display:grid;gap:6px}
.more li::marker{color:var(--c)}
.chev{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-left:auto;transition:transform .3s}
.lvl.open .chev{transform:rotate(180deg)}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.metric{font-family:var(--mono);font-size:.74rem;border:1.5px dashed var(--c);border-radius:8px;padding:3px 8px}

/* stack eras */
.eras{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px;overflow-x:auto}
.eras-in{min-width:560px;display:grid;gap:12px}
.era{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.era span{font-size:.88rem;font-weight:600}
.lane{position:relative;height:22px;background:color-mix(in srgb,var(--line) 50%,transparent);border-radius:6px}
.lane b{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--c);left:var(--a);width:var(--w);transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
.eras.go .lane b{animation-play-state:running}
@keyframes grow{from{transform:scaleX(0)}}
.ticks{display:grid;grid-template-columns:150px 1fr;gap:14px}
.ticks div{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* why */
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.reason{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:10px;align-content:start;transition:transform .3s,box-shadow .3s}
.reason:hover{transform:translateY(-6px);box-shadow:0 18px 40px -18px color-mix(in srgb,var(--c) 60%,transparent)}
.reason .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.reason h3{font-size:1.2rem;font-weight:700}
.reason p{margin:0;color:var(--muted);font-size:.95rem}
.proof{font-family:var(--mono);font-size:.72rem;color:var(--c);font-weight:600}
.reason.big{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 20%,var(--surface)),color-mix(in srgb,var(--a2) 26%,var(--surface)));border-color:color-mix(in srgb,var(--a2) 35%,var(--line))}
.reason.big p{color:color-mix(in srgb,var(--ink) 78%,var(--muted))}

/* skills */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{all:unset;cursor:pointer;font-family:var(--mono);font-size:.78rem;font-weight:600;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;min-height:52px}
.chip{padding:8px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-weight:500;animation:pop .45s cubic-bezier(.2,.9,.3,1.5) both}
@keyframes pop{from{transform:scale(.6);opacity:.3}}

/* edu + contact */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:22px}
.box h3{font-size:1.15rem;margin-bottom:12px}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding-block:10px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .when{grid-row:span 2}
.row small{color:var(--muted)}
.langs{display:grid;gap:12px}
.lg{display:grid;gap:5px}
.lg div{display:flex;justify-content:space-between;font-size:.9rem}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--a2);border-radius:99px}
.contact{margin-block:72px 48px;background:linear-gradient(120deg,color-mix(in srgb,var(--a3) 50%,#000),color-mix(in srgb,var(--a2) 62%,#000));color:#fff;border-radius:28px;padding:36px clamp(20px,4vw,48px);display:grid;gap:14px}
.contact h2{color:#fff}
.cbtns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mail{font-family:var(--mono);font-weight:600;background:rgba(3,10,20,.4);color:#E0F7FA;padding:10px 14px;border-radius:12px;user-select:all;word-break:break-all}
.cb{all:unset;cursor:pointer;font-weight:600;padding:10px 16px;border-radius:12px;border:2px solid #fff;color:#fff}
.cb:hover{background:#fff;color:#0B2A3A}
footer{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-bottom:28px}


/* side quests (GitHub) */
.qfilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.qgraph{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:10px;margin-bottom:18px;overflow-x:auto}
.qgraph svg{display:block;width:100%;min-width:620px;height:auto}
.qgraph .edge{stroke:var(--line);stroke-width:1.5;transition:stroke .25s,stroke-width .25s,opacity .25s}
.qgraph .edge.on{stroke:var(--c);stroke-width:2.6}
.qgraph.dim .edge:not(.on){opacity:.25}
.qgraph .tn circle{fill:var(--bg);stroke:var(--muted);stroke-width:1.5;transition:all .25s}
.qgraph .tn text{font-family:var(--mono);font-size:11px;fill:var(--muted);transition:fill .25s}
.qgraph .tn.on circle{fill:var(--c);stroke:var(--c)}
.qgraph .tn.on text{fill:var(--ink);font-weight:600}
.qgraph .pn{cursor:pointer}
.qgraph .pn circle{fill:var(--c);transition:r .25s}
.qgraph .pn text{font-family:var(--display);font-weight:700;font-size:13px;fill:var(--ink)}
.qgraph .pn.on circle{r:13}
.qgraph.dim .pn:not(.on){opacity:.4}
.qgraph .pulse{fill:var(--c);opacity:.35;animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(2.6);opacity:0}}
.quests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quest{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px;align-content:start;transition:transform .3s,border-color .3s,opacity .3s}
.quest:hover,.quest.on{border-color:var(--c);transform:translateY(-4px)}
.quest[hidden]{display:none!important}
.quest .qk{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:600}
.quest h3{font-size:1.12rem;font-weight:700}
.quest p{margin:0;color:var(--muted);font-size:.92rem}
.quest .tags{display:flex;flex-wrap:wrap;gap:6px}
.quest .tags span{font-family:var(--mono);font-size:.68rem;padding:2px 7px;border-radius:6px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.quest a{font-family:var(--mono);font-size:.75rem;font-weight:600;color:var(--c);text-decoration:none;margin-top:4px}
.quest a:hover{text-decoration:underline}
@media (max-width:820px){.quests{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.quests{grid-template-columns:1fr}}

/* character: sunrise scene + perks */
.me{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:stretch}
.scene{position:relative;border-radius:24px;overflow:hidden;min-height:340px;border:1.5px solid var(--line);background:#FFD9B0}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .sky{transition:opacity 1.6s ease}
.scene .sunG{transition:transform 2.4s cubic-bezier(.3,.7,.2,1)}
.scene.day .sunG{transform:translateY(-120px)}
.scene.day .dawn{opacity:0}
.scene .wave{animation:wave-x 7s ease-in-out infinite alternate}
.scene .wave.w2{animation-duration:9s;animation-direction:alternate-reverse}
@keyframes wave-x{to{transform:translateX(-40px)}}
.scene .rays{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.breath{transform-box:fill-box;transform-origin:center;transition:transform 4s ease-in-out,opacity 1s}
.scene.breathing .breath{opacity:.55}
.scene-ui{position:absolute;left:16px;right:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.scene-ui button{all:unset;cursor:pointer;font-family:var(--mono);font-size:.74rem;font-weight:600;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.88);color:#3A1A10;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.scene-ui button:hover{background:#fff}
.breathe-txt{position:absolute;top:16px;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;color:#3A1A10;text-shadow:0 1px 8px rgba(255,255,255,.6);min-height:1.6em}
.scene-cap{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#5A2A18;font-weight:600}
.scene.breathing .scene-cap{opacity:0}
.perks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.perk{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;align-content:start;transition:transform .3s,border-color .3s}
.perk:hover{transform:translateY(-3px) rotate(.6deg);border-color:var(--c)}
.perk .pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.perk h3{font-size:1.02rem;font-weight:700}
.perk p{margin:0;font-size:.86rem;color:var(--muted)}
.perk .lvl-tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
@media (max-width:820px){
  .me{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .stage{max-width:300px;order:-1}
  .ach{grid-template-columns:repeat(2,minmax(0,1fr))}
  .why{grid-template-columns:1fr}.reason.big{grid-column:auto}
  .two{grid-template-columns:1fr}
}
@media (max-width:480px){
  body{padding:0 16px}
  .path{padding-left:52px}.dot{left:-52px;width:40px;height:40px;font-size:.7rem}.rail{left:18px}
}

/* --- extra motion --- */
#bgfx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
.hero h1 span:nth-child(2){background:linear-gradient(100deg,var(--a1),var(--a3),var(--a2),var(--a1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s .12s cubic-bezier(.2,.9,.3,1.3) both,shimmer 8s linear infinite}
@keyframes shimmer{to{background-position:300% 0}}
.typer{color:var(--a2);border-right:2px solid var(--a2);padding-right:3px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{border-color:transparent}}
.sec-head h2::after{content:"";display:block;height:4px;width:72px;margin-top:14px;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a3));transition:width 1s .2s cubic-bezier(.2,.8,.2,1)}
.js-rv .rv{transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.js-rv .rv:not(.in){opacity:.2;transform:translateY(34px) scale(.97)}
.js-rv .sec-head.rv:not(.in) h2::after{width:0}

 $("#qGrid").querySelectorAll(".quest").forEach(el=>{el.onmouseenter=()=>hl(+el.dataset.i);el.onmouseleave=()=>hl(null)});
 const vis=Q.map((q,i)=>i).filter(i=>qf==="all"||Q[i].cat===qf);
 const tech=[...new Set(vis.flatMap(i=>Q[i].tags||[]))];
 const W=800,H=440,cx=400,cy=220,pp={},tp={};
 vis.forEach((i,k)=>{const a=-Math.PI/2+k/vis.length*Math.PI*2;pp[i]=[cx+Math.cos(a)*330,cy+Math.sin(a)*175]});
 tech.forEach((t,k)=>{const a=-Math.PI/2+(k+.5)/tech.length*Math.PI*2;const r=[.3,.52,.72][k%3];tp[t]=[cx+Math.cos(a)*330*r,cy+Math.sin(a)*175*r]});
 let e="",n="",p="";
 vis.forEach(i=>(Q[i].tags||[]).forEach(t=>{e+=`<line class="edge" data-p="${i}" data-t="${esc(t)}" style="--c:${catColor(Q[i].cat)}" x1="${pp[i][0].toFixed(1)}" y1="${pp[i][1].toFixed(1)}" x2="${tp[t][0].toFixed(1)}" y2="${tp[t][1].toFixed(1)}"/>`}));
 tech.forEach(t=>{const[x,y]=tp[t];n+=`<g class="tn" data-t="${esc(t)}" style="--c:var(--a4)"><circle cx="${x}" cy="${y}" r="6"/><text x="${x}" y="${y-11}" text-anchor="middle">${esc(t)}</text></g>`});
 vis.forEach(i=>{const[x,y]=pp[i];const anc=x<cx-60?"end":x>cx+60?"start":"middle";const dx=anc==="end"?-16:anc==="start"?16:0;const dy=anc==="middle"?(y<cy?-16:26):5;

  g.onclick=()=>{const c=$(`.quest[data-i="${i}"]`);c&&c.scrollIntoView({behavior:"smooth",block:"center"});hl(i)}});

}
function hl(i){qh=i;const g=$("#qg");if(!g)return;g.classList.toggle("dim",i!==null);

function renderPerks(){
 const ch=P.character;if(!ch)return;
 $("#perks").innerHTML=(ch.perks||[]).map((p,i)=>`<div class="perk" style="--c:${col(p.color||["a2","a1","a3","a4"][i%4])}"><div class="pi">${ICO(p.icon,20)}</div><div class="lvl-tag">${esc(ui("perk"))}</div><h3>${esc(tx(p.title))}</h3><p>${esc(tx(p.text))}</p></div>`).join("");
 if(ch.intro)$('#me .sec-head p').textContent=tx(ch.intro),$('#me .sec-head p').hidden=false;
 $("#sceneCap").textContent=tx(ch.caption);
 $("#sunBtn").textContent=$("#scene").classList.contains("day")?ui("sunDown"):ui("sunUp");
 if(!breathing)$("#breatheBtn").textContent=ui("breathe");
}
function stopBreath(){clearInterval(breathing);breathing=null;$("#scene").classList.remove("breathing");$("#breathRing").style.transform="";$("#breatheTxt").textContent="";$("#breatheBtn").textContent=ui("breathe")}

// ---------- scroll: rail + level-up ----------
let booted=false;const popped=new Set();
function lightUp(){
 const lv=$("#levels"),r=lv.getBoundingClientRect(),vh=innerHeight;
 const p=Math.max(0,Math.min(1,(vh*.6-r.top)/r.height));
 const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 $("#railFill").style.setProperty("--p",(reduce?100:p*100)+"%");
 lv.querySelectorAll(".lvl").forEach((el,i)=>{const t=el.getBoundingClientRect().top;const on=reduce||t<vh*.6;
  if(on&&!el.classList.contains("lit")&&!reduce&&booted&&!popped.has(i)){popped.add(i);const b=document.createElement("div");b.className="lvup";b.textContent=ui("levelUp");el.appendChild(b);setTimeout(()=>b.remove(),1500)}
  el.classList.toggle("lit",on)});
}
addEventListener("scroll",lightUp,{passive:true});addEventListener("resize",lightUp);

// ---------- interactions ----------
let bi=0,bt;
$("#avatar").onclick=()=>{const st=$("#stage"),bu=$("#bubble");st.classList.remove("wave");void st.offsetWidth;st.classList.add("wave");
 const bs=tx(P.bubbles)||[];if(!bs.length)return;
 bu.textContent=bs[bi++%bs.length];bu.classList.remove("hide");clearTimeout(bt);bt=setTimeout(()=>bu.classList.add("hide"),3200)};
setTimeout(()=>$("#avatar").click(),900);
$("#copy").onclick=async()=>{const m=(P.contact&&P.contact.email)||"";try{await navigator.clipboard.writeText(m);$("#copy").textContent=ui("copied")}catch(e){const r=document.createRange();r.selectNodeContents($("#mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)}};
$("#sunBtn").onclick=()=>{const sc=$("#scene");sc.classList.toggle("day");$("#sunBtn").textContent=sc.classList.contains("day")?ui("sunDown"):ui("sunUp")};
$("#breatheBtn").onclick=()=>{if(breathing){stopBreath();return}
 const sc=$("#scene"),ring=$("#breathRing"),txt=$("#breatheTxt");sc.classList.add("breathing");$("#breatheBtn").textContent=ui("stop");
 let inhale=true,n=0;const step=()=>{ring.style.transform=inhale?"scale(1.9)":"scale(1)";txt.textContent=inhale?ui("bin"):ui("bout");inhale=!inhale;if(++n>8)stopBreath()};
 step();breathing=setInterval(step,4000)};

staticFill();
render();

// ---------- motion ----------
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
(()=>{if(RM)return;const el=$("#typer");let w=0,c=(tx(P.rotating)[0]||"").length,del=true,hold=26;el.dataset.live=1;
 setInterval(()=>{const list=tx(P.rotating)||[];if(!list.length)return;
  if(hold>0){hold--;return}
  if(del){c--;if(c<=0){del=false;w++}}else{c++;if(c>=list[w%list.length].length){del=true;hold=26}}
  el.textContent=list[w%list.length].slice(0,Math.max(0,c))||"​"},70)})();
let io;
function wireMotion(){
 if(RM||!("IntersectionObserver" in window))return;
 document.documentElement.classList.add("js-rv");
 io=io||new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");
   if(t.classList.contains("badge")&&!t.dataset.done)countUp(t);
   if(t.id==="erasBox")t.classList.add("go");
   io.unobserve(t)}),{threshold:.15,rootMargin:"0px 0px -6% 0px"});
 [".sec-head",".badge",".reason",".quest",".perk",".box",".scene",".qgraph"].forEach(g=>document.querySelectorAll(g).forEach((el,i)=>{if(el.classList.contains("in")||el.classList.contains("rv"))return;el.classList.add("rv");el.style.setProperty("--d",(i%3*0.09)+"s");io.observe(el)}));
 const eb=$("#erasBox");if(!eb.classList.contains("go"))io.observe(eb);
 document.querySelectorAll(".reason,.quest,.perk,.badge").forEach(el=>{if(el.dataset.tilt)return;el.dataset.tilt=1;el.classList.add("tilt");
  el.addEventListener("mousemove",ev=>{const r=el.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
   el.style.setProperty("--mx",x+"px");el.style.setProperty("--my",y+"px");el.classList.add("tilting");
   el.style.transform=`perspective(700px) rotateY(${((x/r.width)-.5)*8}deg) rotateX(${(.5-(y/r.height))*8}deg) translateY(-4px)`});
  el.addEventListener("mouseleave",()=>{el.classList.remove("tilting");el.style.transform="";el.style.setProperty("--mx","-200px")})});
}
function countUp(b){b.dataset.done=1;const n=b.querySelector(".n"),txt=n.textContent,m=txt.match(/^([+−-]?)(\d+)(.*)$/);if(!m)return;
 const end=+m[2],t0=performance.now(),dur=1300;
 const tick=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(end*(1-Math.pow(1-k,3)));n.textContent=m[1]+v+m[3];if(k<1)requestAnimationFrame(tick);else{n.textContent=txt;b.classList.add("counted")}};requestAnimationFrame(tick)}
(()=>{const cv=$("#bgfx"),ctx=cv.getContext("2d");let W,H,Pt=[],dpr=Math.min(2,devicePixelRatio||1),mx=-999,my=-999;
 const cs=getComputedStyle(document.documentElement);
 const rgb=h=>{h=(h||"").trim().replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return isNaN(n)?"120,200,220":`${n>>16&255},${n>>8&255},${n&255}`};
 const cols=["--a1","--a3","--a2"].map(v=>rgb(cs.getPropertyValue(v)));
 function size(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;const n=Math.round(Math.min(70,innerWidth/18));
  Pt=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.15*dpr,vy:-(.08+Math.random()*.25)*dpr,r:(.8+Math.random()*1.8)*dpr,c:cols[Math.floor(Math.random()*3)],p:Math.random()*6.28}))}
 size();addEventListener("resize",size);addEventListener("mousemove",e=>{mx=e.clientX*dpr;my=e.clientY*dpr});
 function draw(t){ctx.clearRect(0,0,W,H);const L2=(120*dpr)**2;
  for(let i=0;i<Pt.length;i++){const a=Pt[i];
   if(!RM){a.x+=a.vx;a.y+=a.vy;if(a.y<-10){a.y=H+10;a.x=Math.random()*W}if(a.x<-10)a.x=W+10;if(a.x>W+10)a.x=-10;
    const dx=a.x-mx,dy=a.y-my,d=dx*dx+dy*dy;if(d<(90*dpr)**2){a.x+=dx/Math.sqrt(d+1)*.8;a.y+=dy/Math.sqrt(d+1)*.8}}
   for(let j=i+1;j<Pt.length;j++){const b=Pt[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;if(d<L2){ctx.strokeStyle=`rgba(${a.c},${(1-d/L2)*.16})`;ctx.lineWidth=dpr*.8;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
   const tw=.45+.35*Math.sin(t/900+a.p);ctx.fillStyle=`rgba(${a.c},${tw})`;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.283);ctx.fill()}
  if(!RM)requestAnimationFrame(draw)}
 requestAnimationFrame(draw)})();
wireMotion();booted=true;
</script>
</body>
</html>
